name: Android Kernel

on:
  workflow_dispatch:

jobs:
  buildkernel:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Display Python version
        run: python --version

      # Setup environment
      - name: Setup build environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            bc flex git ccache automake lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib python3-networkx libxml2-utils \
            bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool optipng libssl-dev python-is-python3 python3-virtualenv
          
          mkdir -p ~/.bin
          echo 'export PATH=$HOME/.bin:$PATH' >> ~/.bashrc
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo

      # Set script permissions
      - name: Make build script executable
        run: chmod +x build_kernel.sh

      # Build kernel
      - name: Build kernel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          set -e
          bash -x build_kernel.sh

      # Package kernel output
      - name: Package kernel
        id: package
        run: |
          git clone https://github.com/SameerAlSahab/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md

          OUTPUT=""
          if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            OUTPUT="Image.gz-dtb"
          elif [[ -f out/arch/arm64/boot/Image-dtb ]]; then
            cp out/arch/arm64/boot/Image-dtb AnyKernel3/Image-dtb
            OUTPUT="Image-dtb"
          elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
            OUTPUT="Image.gz"
          elif [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
            OUTPUT="Image"
          fi

          if [[ -f out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

          echo "zip_name=${OUTPUT}.zip" >> $GITHUB_OUTPUT
          echo "build_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT
          echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Upload as GitHub artifact
      - name: Upload kernel to artifact
        uses: actions/upload-artifact@v4
        with:
          name: output_kernel
          path: AnyKernel3/*

      # Telegram notification
      - name: Send kernel to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          ZIP_FILE="AnyKernel3/${{ steps.package.outputs.zip_name }}"
          curl -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
            -F chat_id="$CHAT_ID" \
            -F document=@"$ZIP_FILE" \
            -F caption="✅ Kernel Build Success!%0A📅 Build Date: ${{ steps.package.outputs.build_date }}%0A🔨 Commit: ${{ steps.package.outputs.commit_hash }}%0A📦 File: ${ZIP_FILE##*/}%0A#Ishihara0xn #Kernel"
